name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci
      - name: lint + typecheck
        working-directory: web
        run: npm run lint
      - name: test
        working-directory: web
        run: npm test -- --run --passWithNoTests
      - name: build
        working-directory: web
        run: npm run build
